<!-- Development-only browser audit. Serve the repository root, open this file,
     and run the layout and navigation checks. Third-party iframe internals are
     cross-origin and are outside the layout assertions. AOS transitions are
     disabled only inside the fixture to measure the final content positions. -->
<!doctype html><meta charset="utf-8"><title>Portfolio responsive audit (development)</title>
<style>body{font:14px system-ui;background:#eee;color:#111;margin:16px}button,select{font:inherit;margin:4px;padding:8px}#stage{overflow:auto;border:1px solid #aaa;width:100%;height:850px}iframe{border:0;height:820px;display:block;background:#060913}pre{white-space:pre-wrap;display:none} .controls{position:sticky;top:0;background:#eee;padding:8px;z-index:1}</style>
<div class="controls"><button id="navigation">Test navigation</button><button id="run">Run responsive audit</button><select id="page"></select><select id="size"></select><button id="show">Show page</button><button id="fit">Fit preview</button><span id="status">Ready</span></div><pre id="results"></pre><div id="stage"><iframe id="view" title="Portfolio test viewport"></iframe></div>
<script>
const files=["index.html", "pages/curriculum/curriculum.html", "pages/projects/projects.html", "pages/gallery/gallery.html", "pages/gallery/pages/branding.html", "pages/gallery/pages/graphics.html", "pages/gallery/pages/3d-design.html", "pages/data-analyst/data-analyst.html", "pages/data-analyst/pages/azure.html", "pages/data-analyst/pages/excel.html", "pages/data-analyst/pages/mysql.html", "pages/data-analyst/pages/power-bi.html", "pages/data-analyst/pages/Pyton-Pandas.html", "pages/data-analyst/pages/tableau.html", "privacy.html", "pages/projects/pages/glastonbury/index.html", "pages/projects/pages/old-portfolio/old-portfolio.html", "pages/projects/pages/glastonbury/pages/line-up.html", "pages/projects/pages/glastonbury/pages/news.html", "pages/projects/pages/glastonbury/pages/info.html", "pages/projects/pages/glastonbury/pages/areas.html", "pages/projects/pages/glastonbury/pages/gallery.html", "pages/projects/pages/glastonbury/pages/shop.html", "pages/projects/pages/old-portfolio/homepages/projects.html", "pages/projects/pages/old-portfolio/homepages/wada-solutions/index.html", "pages/projects/pages/old-portfolio/homepages/heat-wave/index-heat-wave.html", "pages/projects/pages/old-portfolio/homepages/streamer/index-streamer.html", "pages/projects/pages/old-portfolio/homepages/curriculum/index-cv.html", "pages/projects/pages/old-portfolio/homepages/streamer/pages/trovo.html", "pages/projects/pages/old-portfolio/homepages/streamer/pages/youtube.html", "pages/projects/pages/old-portfolio/homepages/streamer/pages/instagram.html", "pages/projects/pages/old-portfolio/homepages/streamer/pages/tiktok.html", "pages/projects/pages/old-portfolio/homepages/streamer/pages/twitch.html", "pages/projects/pages/old-portfolio/homepages/streamer/pages/discord.html", "pages/projects/pages/old-portfolio/homepages/streamer/pages/facebook.html", "pages/projects/pages/old-portfolio/homepages/curriculum/pages/Profile.html", "pages/projects/pages/old-portfolio/homepages/curriculum/pages/Curriculum.html", "pages/projects/pages/old-portfolio/homepages/curriculum/pages/Key Skills.html", "pages/projects/pages/old-portfolio/homepages/curriculum/pages/Education.html", "pages/projects/pages/old-portfolio/homepages/curriculum/pages/Work Exerience.html", "pages/projects/pages/old-portfolio/homepages/curriculum/pages/Hobbies.html", "pages/projects/pages/old-portfolio/homepages/curriculum/pages/More Abou Me.html", "pages/data-analyst/pages/PandasDataFrames_01.html", "pages/data-analyst/pages/Python_Day_2_Exercises_Master.html", "pages/data-analyst/pages/Python_Day_1_Exercises_Master.html", "pages/data-analyst/pages/PandasDataFrames_02.html"];
const widths=[280,320,375,480,768,769,820,960,1024,1280,1920,2560,3840,7680];
const frame=document.querySelector('#view'),result=document.querySelector('#results'),status=document.querySelector('#status'),page=document.querySelector('#page'),size=document.querySelector('#size');
files.forEach(f=>page.add(new Option(f,f)));widths.forEach(w=>size.add(new Option(w,w)));
const pause=ms=>new Promise(r=>setTimeout(r,ms));
async function load(file){await new Promise(r=>{frame.onload=r;frame.src='/'+file});for(let i=0;i<60&&frame.contentDocument.querySelector('#site-header')&&!frame.contentDocument.querySelector('.gt-navbar');i++)await pause(50);const style=frame.contentDocument.createElement('style');style.textContent='[data-aos]{opacity:1!important;transform:none!important;transition:none!important}*,*::before,*::after{animation:none!important;transition:none!important}';frame.contentDocument.head.append(style);}
async function measure(width){frame.style.width=width+'px';frame.style.height=(width>=1920?width*9/16:844)+'px';await pause(60);const doc=frame.contentDocument,win=frame.contentWindow,vw=doc.documentElement.clientWidth;
 const name=e=>e.tagName.toLowerCase()+(e.id?'#'+e.id:'')+(typeof e.className==='string'&&e.className?'.'+e.className.trim().split(/\s+/).join('.'):'');
 const visible=e=>{const r=e.getBoundingClientRect(),s=win.getComputedStyle(e);return r.width&&r.height&&s.display!=='none'&&s.visibility!=='hidden'&&s.opacity!=='0'&&!e.closest('#lightbox,.aos-animate[style]')};
 const contained=e=>{for(let p=e.parentElement;p&&p!==doc.body;p=p.parentElement){const r=p.getBoundingClientRect();if(['auto','scroll','hidden','clip'].includes(win.getComputedStyle(p).overflowX)&&r.left>=0&&r.right<=vw+1)return true;}return false;};const overflow=[...doc.querySelectorAll('body *')].filter(e=>visible(e)&&!contained(e)&&(e.getBoundingClientRect().right>vw+1||e.getBoundingClientRect().left< -1)).map(e=>({el:name(e),x:Math.round(e.getBoundingClientRect().x),w:Math.round(e.getBoundingClientRect().width),text:e.textContent?.trim().slice(0,50)}));
 const clipped=[...doc.querySelectorAll('h1,h2,h3,p,.click-hint,.tool-item')].filter(e=>visible(e)&&e.clientWidth&&e.scrollWidth>e.clientWidth+2).map(e=>({el:name(e),client:e.clientWidth,scroll:e.scrollWidth,text:e.textContent.trim().slice(0,50)}));
 return {width,vw,body:doc.body.scrollWidth,overflow,clipped,rootFont:win.getComputedStyle(doc.documentElement).fontSize};}
document.querySelector('#fit').onclick=()=>{frame.style.transform='scale('+Math.min(1,document.querySelector('#stage').clientWidth/parseFloat(frame.style.width))+')';frame.style.transformOrigin='top left';};document.querySelector('#show').onclick=async()=>{frame.style.transform='none';result.textContent='';await load(page.value);frame.style.width=size.value+'px';frame.style.height=(+size.value>=1920?+size.value*9/16:844)+'px';status.textContent='Showing '+size.value;};
document.querySelector('#run').onclick=async()=>{window.auditResults=[];for(const file of files){status.textContent='Testing '+file;await load(file);for(const width of widths){const row={file,...await measure(width)};window.auditResults.push(row);}}result.textContent=JSON.stringify({cases:auditResults.length,failures:auditResults.filter(r=>r.overflow.length||r.clipped.length)},null,2);status.textContent='Complete';};

document.querySelector('#navigation').onclick=async()=>{
 const checks=[];
 for(const file of ['index.html','pages/data-analyst/pages/Pyton-Pandas.html','pages/data-analyst/pages/tableau.html']){
  await load(file);
  for(const width of [320,375,768,769,820,960,1023,1024,1280,1920,3840,7680]){
   await measure(width);
   const d=frame.contentDocument,w=frame.contentWindow,t=d.querySelector('.gt-navbar-toggler'),c=d.querySelector('.gt-navbar-collapse');
   const mobile=w.getComputedStyle(t).display!=='none';
   for(const toggle of d.querySelectorAll('.gt-dropdown-toggle')){
    if(mobile&&t.getAttribute('aria-expanded')!=='true')t.click();
    toggle.click();
    const menu=toggle.closest('.gt-dropdown').querySelector('.gt-dropdown-menu');
    const mr=menu.getBoundingClientRect();
    const opened=w.getComputedStyle(menu).display!=='none'&&mr.height>0&&toggle.getAttribute('aria-expanded')==='true';
    const fits=mr.left>=-1&&mr.right<=d.documentElement.clientWidth+1;
    toggle.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));
    const escaped=toggle.getAttribute('aria-expanded')==='false'&&(!mobile||t.getAttribute('aria-expanded')==='false');
    checks.push({file,width,dropdown:toggle.textContent.trim(),mobile,opened,fits,escaped});
   }
  }
 }
 result.textContent=JSON.stringify({navigation:checks,failed:checks.filter(r=>!r.opened||!r.fits||!r.escaped)});status.textContent='Navigation complete';
};
</script>
